name: SCA Scan (next)

# Next-iteration caller on the fork (see sca-scan.yml): manual runs only, removed once merged upstream.
on:
  workflow_dispatch: {}

concurrency:
  group: sca-scan-next
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  sca:
    uses: vitado/ai-dial-ci/.github/workflows/sca_scheduled.yml@pilot/sca-next
    with:
      repository: epam/ai-dial-chat
      images: |
        epam/ai-dial-chat
        epam/ai-dial-chat-mcp-app-sandbox
        epam/ai-dial-chat-bff
